# Cut a hermetic-gnat release.
#
# A release is a version of *this repository* (the recipe): it contains one
# archive per platform for every GCC version in versions/, all built by the
# same scripts at the same commit.  A recipe fix is therefore one release,
# and rules_ada tracks one hermetic-gnat release at a time.
#
# Versions are dates: YYYY.MM.DD (UTC), with a .N suffix if there already is
# a release that day (2026.09.30, 2026.09.30.1, ...).  A recipe has nothing
# to version but the point in time it was built at.
#
# Two ways to start one:
#
#   1. Actions -> Release -> "Run workflow".  The version defaults to today;
#      the tag is created only after every archive has built and passed its
#      checks, together with the GitHub release.  Nothing to clean up if a
#      build fails.
#
#   2. Push the tag yourself:  git tag 2026.09.30 && git push origin 2026.09.30
#
# Every release carries the archives (gnat-<arch>-<os>-<gcc>.tar.gz), their
# sha256 sidecars, a SHA256SUMS file, the build manifests, and notes with
# the ready-to-paste rules_ada versions.bzl content.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version, YYYY.MM.DD or YYYY.MM.DD.N (empty = today's UTC date,
          with the next free .N if a release already exists for it)
        type: string
        default: ""
  push:
    tags:
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9]"
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*"

permissions:
  contents: read

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version and tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      tag_exists: ${{ steps.check.outputs.tag_exists }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          taken() {   # release or tag with this name already exists
            gh release view "$1" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
              || git ls-remote --exit-code --tags origin "refs/tags/$1" >/dev/null 2>&1
          }
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            version="${GITHUB_REF_NAME}"
            tag_exists=true
          elif [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
            tag_exists=false
          else
            version="$(date -u +%Y.%m.%d)"
            n=1
            while taken "${version}"; do
              version="$(date -u +%Y.%m.%d).${n}"
              n=$((n + 1))
            done
            tag_exists=false
          fi
          case "${version}" in
            20[0-9][0-9].[0-9][0-9].[0-9][0-9]|20[0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*) ;;
            *) echo "::error::version '${version}' is not YYYY.MM.DD or YYYY.MM.DD.N"; exit 1 ;;
          esac
          tag="${version}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [ "${tag_exists}" = true ]; then
              # A manual run that publishes with a personal token creates the
              # tag, which triggers this workflow again: nothing to do.
              echo "::notice::release ${tag} already exists; nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::release ${tag} already exists"
            exit 1
          fi
          if [ "${tag_exists}" = false ] && git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists without a release; delete it or pick another version"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "tag_exists=${tag_exists}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          echo "releasing hermetic-gnat ${tag} from ${GITHUB_SHA}: GCC $(scripts/env.sh --list | tr '\n' ' ')"

  build:
    name: Build and verify
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/build.yml
    with:
      gcc_versions: all
      hg_version: ${{ needs.resolve.outputs.version }}
    permissions:
      contents: read

  publish:
    name: Create GitHub release
    needs: [resolve, build]
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: gnat-*
          path: dist
          merge-multiple: true

      - name: Assemble release
        run: |
          set -euo pipefail
          cd dist
          ls -la
          # Every GCC version on every platform must be present: a partial
          # release is worse than none.
          for gcc in $(../scripts/env.sh --list); do
            for p in x86_64-linux aarch64-linux x86_64-darwin aarch64-darwin x86_64-windows64; do
              f="gnat-${p}-${gcc}.tar.gz"
              [ -f "${f}" ] || { echo "::error::missing ${f}"; exit 1; }
              [ -f "${f}.sha256" ] || { echo "::error::missing ${f}.sha256"; exit 1; }
              sha256sum -c "${f}.sha256"
            done
          done
          cat ./*.tar.gz.sha256 > SHA256SUMS
          cd ..
          scripts/ci/release-notes.sh dist "${{ needs.resolve.outputs.tag }}" > notes.md
          cat notes.md

      # Creates the tag (on the commit that was built, unless it already
      # exists from a tag push) and the release in one call.  GITHUB_TOKEN
      # with contents: write is enough unless an organisation policy caps it
      # or a tag ruleset / tag protection rule denies it; then store a
      # fine-grained PAT (this repository, Contents: read and write) or a
      # GitHub App token as the RELEASE_TOKEN secret.
      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.tag_exists != 'true' && github.sha || '' }}
          name: hermetic-gnat ${{ needs.resolve.outputs.tag }}
          body_path: notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.manifest.json
            dist/SHA256SUMS
